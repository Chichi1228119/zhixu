[build-system]
requires = ["setuptools>=77.0", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "zhixu-knowledge-assistant"
dynamic = ["version"]
description = "Local-first document search and source-grounded answers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["rag", "knowledge-base", "document-search", "local-first"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.162.0,<0.163",
    "uvicorn>=0.54.0,<0.55",
    "python-multipart>=0.0.32,<0.1",
    "pypdf>=6.21.2,<7",
    "rank-bm25>=0.2.2,<0.3",
    "scikit-learn>=1.9.1,<2",
    "httpx>=0.28.1,<0.29",
    "python-docx>=1.2,<2",
    "argon2-cffi>=25.1,<26",
]

[project.urls]
Homepage = "https://github.com/Chichi1228119/zhixu"
Repository = "https://github.com/Chichi1228119/zhixu"
Documentation = "https://github.com/Chichi1228119/zhixu/blob/main/docs/user-guide.md"
Issues = "https://github.com/Chichi1228119/zhixu/issues"

[project.optional-dependencies]
semantic = ["fastembed>=0.9.1,<0.10"]
dev = ["pytest>=9.1.1,<10", "build>=1.2,<2", "setuptools>=77.0", "wheel>=0.45"]
authoring = ["reportlab>=4.4.9,<5", "pypdfium2>=5.14,<6"]

[project.scripts]
zhixu = "app.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["app.tests*", "app.private*", "app.runtime*"]
namespaces = false

[tool.setuptools.package-data]
app = ["static/*", "static/**/*", "resources/*", "resources/**/*"]

[tool.setuptools.exclude-package-data]
app = ["**/__pycache__/*", "**/*.pyc", "**/.env", "**/*.db", "**/*.sqlite*", "**/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
